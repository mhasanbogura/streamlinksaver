<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>StreamLink Saver — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <!-- Broadcast Atelier: quiet utility panel with a single precise path control. -->
    <main class="settings-shell" aria-labelledby="settings-title">
      <header class="settings-header">
        <img src="icon64.png" alt="" />
        <div><p>SAVER / SETTINGS</p><h1 id="settings-title">Settings</h1></div>
      </header>
      <section class="settings-card">
        <p class="eyebrow">DEFAULT LOCATION</p>
        <label for="save-path">Downloads-relative path</label>
        <input id="save-path" type="text" autocomplete="off" spellcheck="false" placeholder="Downloads/" />
        <p class="hint">Leave this as <code>Downloads/</code> to save at the root. Use <code>Downloads/Direct Link</code> for a fixed subfolder.</p>
        <p class="eyebrow" style="margin-top:26px">NOTIFICATIONS</p>
        <label class="switch-row" for="notifications-enabled">
          <input id="notifications-enabled" type="checkbox" />
          <span>Show a notification when a link is saved</span>
        </label>
        <p class="hint">Turn this off to save silently without pop-up notifications.</p>
        <div class="actions"><button id="reset-button" class="quiet" type="button">Reset</button><button id="save-button" type="button">Save settings</button></div>
        <p id="status" role="status">Loading settings…</p>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
