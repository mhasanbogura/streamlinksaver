<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>StreamLink Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Broadcast Atelier: compact editorial control strip with graphite layers and Signal Vermilion action states. -->
    <main class="popup-shell" aria-labelledby="app-title">
      <div class="noise" aria-hidden="true"></div>
      <header class="masthead">
        <div class="brand-lockup">
          <svg class="brand-mark" viewBox="0 0 36 36" role="img" aria-label="StreamLink Saver">
            <path d="M4 8.5h18v19H4z" fill="none" stroke="currentColor" stroke-width="2.2" />
            <path d="M2 18h10.8l4.1-4.1H34" fill="none" stroke="#ff5630" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M28 10.5h5v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
          </svg>
          <div>
            <h1 id="app-title">StreamLink Saver</h1>
            <p id="app-version">SAVER</p>
          </div>
        </div>
        <div class="masthead-actions">
          <button id="settings-button" class="settings-button" type="button" aria-label="Open save-path settings" title="Save-path settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Zm0-11.5 1.01 1.7 1.94.45 1.56-1.22 1.9 1.9-1.22 1.56.45 1.94 1.7 1.01v2.68l-1.7 1.01-.45 1.94 1.22 1.56-1.9 1.9-1.56-1.22-1.94.45L12 20.25H9.32l-1.01-1.7-1.94-.45-1.56 1.22-1.9-1.9 1.22-1.56-.45-1.94-1.7-1.01V9.23l1.7-1.01.45-1.94-1.22-1.56 1.9-1.9 1.56 1.22 1.94-.45 1.01-1.7H12Z" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round" /></svg>
          </button>
          <span class="local-badge"><i></i> LOCAL</span>
        </div>
      </header>

      <section class="intro" aria-label="Workflow introduction">
        <p class="eyebrow">ROUTE A SOURCE</p>
        <h2>Save Stream<br />Link.</h2>
        <p class="subcopy">The file stores the URL only. It does not download the media.</p>
      </section>

      <section class="source-section" aria-label="Source URL">
        <div class="section-heading">
          <label for="source-url">SOURCE URL</label>
          <button id="current-page" class="text-button" type="button">Use current page</button>
        </div>
        <div class="field-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 13.5l3-3m-7.15 5.65 2.1-2.1m7.15-7.15 2.1-2.1a3.54 3.54 0 00-5-5l-2.1 2.1m7.15 7.15a3.54 3.54 0 01-5 5l-2.1-2.1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" /></svg>
          <input id="source-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/movie.mp4" aria-describedby="url-hint" />
        </div>
        <p id="url-hint" class="field-hint">HTTPS and HTTP links are supported.</p>
      </section>

      <div class="route" aria-hidden="true"><span></span><i></i></div>

      <section class="output-section" aria-label="Generated .strm file">
        <div class="section-heading">
          <label for="file-name">OUTPUT FILE</label>
          <span class="format-badge">.STRM</span>
        </div>
        <div class="output-plate">
          <div class="file-glyph" aria-hidden="true"><span></span></div>
          <div class="file-detail">
            <input id="file-name" type="text" autocomplete="off" spellcheck="false" value="movie" aria-label="Output filename without extension" />
            <p id="file-preview">movie.strm</p>
          </div>
          <div class="status-dot" id="status-dot" aria-hidden="true"></div>
        </div>
      </section>

      <button id="save-button" class="save-button" type="button">
        <span>Save Stream Link</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v3h14v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>

      <p id="status-message" class="status-message" role="status">Ready to route a URL.</p>
    </main>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
